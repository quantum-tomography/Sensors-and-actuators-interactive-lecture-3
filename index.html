      "title": "Quantum optical magnetometer",
      "text": "\n\n<div style=\"max-width: 900px; margin: 0 auto 22px auto; padding: 22px 28px; background: linear-gradient(135deg, #172033, #243247); color: #e2e8f0; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); font-family: Arial, sans-serif; line-height: 1.65;\">\n\n  <details>\n    <summary style=\"cursor:pointer; font-size:1.25em; font-weight:bold; color:#7dd3fc; padding:6px 0;\">\n      First, what is diamond?\n    <\/summary>\n\n    <div style=\"margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.15);\">\n\n      <p>\n        <strong>Diamond<\/strong> is a crystalline form of carbon in which the atoms are arranged in a structure known as the <strong>diamond cubic lattice<\/strong>. In its pure form, diamond is colorless, odorless and tasteless. ①\n\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/1.png\" target=\"_blank\">\n    <img src=\"images/1.png\" alt=\"Diamond and graphite: the same element, carbon, arranged in different crystal structures. Image: Itub, Wikimedia Commons, CC BY-SA 3.0.\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Diamond and graphite: the same element, carbon, arranged in different crystal structures. Image: Itub, Wikimedia Commons, CC BY-SA 3.0. (click to enlarge)<\/div>\n<\/div>\n\n\n\n        It is an extremely hard but brittle material, does not dissolve in water, and is a poor electrical conductor. Diamond is a <strong>metastable<\/strong> form of carbon under ordinary conditions. ②\n        This means that carbon in the form of diamond is not in its lowest-energy state; <strong>graphite has a lower energy and is therefore the more stable form<\/strong>. However, changing the atomic structure of diamond into graphite requires overcoming a large <strong>energy barrier<\/strong>. ③\n        As a result, the transformation is so slow under ordinary conditions that a diamond can remain a diamond for an extremely long time. Diamond has the highest hardness and thermal conductivity of any naturally occurring material, which makes it useful for applications such as cutting, drilling and polishing. ④\n      <\/p>\n\n      <p>\n        The diamond crystal lattice is exceptionally rigid and normally accommodates very few impurities. Two important exceptions are <strong>nitrogen and boron<\/strong>. ⑤\n        Even very small concentrations of impurities or lattice defects—on the order of one defect or impurity per million carbon atoms—can significantly affect a diamond's color. Boron can produce a blue color, while nitrogen can produce yellow. ⑥\n        Lattice defects and radiation exposure can result in brown, green, pink, purple, orange or red coloration. Diamond also has a high refractive index and relatively high optical dispersion. ⑦\n      <\/p>\n\n      <p>\n        Most natural diamonds are approximately <strong>1 to 3.5 billion years old<\/strong>. They generally formed in Earth's mantle at depths of about <strong>150–250 km<\/strong>, although some diamonds originated at depths approaching <strong>800 km<\/strong>. ⑧\n        Their formation occurred under conditions of very high pressure and temperature. Much later, volcanic activity transported diamonds toward the surface, where they are commonly found in volcanic rocks called <strong>kimberlites and lamproites<\/strong>. ⑨\n      <\/p>\n\n      <p>\n        Diamonds can also be produced artificially. <strong>Synthetic diamonds<\/strong> are commonly manufactured either by subjecting high-purity carbon to <strong>high pressure and high temperature (HPHT)<\/strong> or by growing diamond from hydrocarbon gases using <strong>chemical vapor deposition (CVD)<\/strong>. ⑩\n        Both methods can produce crystalline diamond with properties similar to those of natural diamond. Natural and synthetic diamonds can be distinguished using techniques based on their optical properties and thermal conductivity. ⑪\n      <\/p>\n\n    <\/div>\n  <\/details>\n\n<\/div>\n\n<div style=\"max-width: 900px; margin: 0 auto; padding: 28px 32px; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.28); font-family: Arial, sans-serif; line-height: 1.7; position: relative;\">\n\n  <h2 style=\"margin-top: 0; margin-bottom: 18px; font-size: 2em; color: #f8fafc;\">\n    How does an NV-diamond magnetometer work?\n  <\/h2>\n\n  <p>\n    An NV-diamond magnetometer uses tiny defects in the crystal structure of a diamond, called <strong>nitrogen-vacancy (NV) centers<\/strong>, to measure magnetic fields. A nitrogen-vacancy center consists of a <strong>nitrogen atom that substitutes for a carbon atom<\/strong> in the diamond lattice, together with a <strong>vacancy at a neighboring lattice site<\/strong>. ⑫\n  <\/p>\n\n  <p>\n    A <strong>green laser<\/strong> illuminates the diamond and excites the NV centers. When they return to a lower-energy state, they emit <strong>red fluorescent light<\/strong>. ⑬\n  <\/p>\n\n  <p>\n    At the same time, a <strong>microwave signal<\/strong> is applied to the diamond. At particular microwave frequencies, the quantum spin state of the NV centers changes, causing a measurable change in the intensity of the fluorescence. ⑭\n  <\/p>\n\n  <p>\n    An <strong>external magnetic field<\/strong> shifts these characteristic resonance frequencies. A <strong>photodetector<\/strong> measures the fluorescent light, while the control and analysis unit determines how much the resonance frequencies have shifted. ⑮\n  <\/p>\n\n  <p>\n    From this shift, we can determine the <strong>strength<\/strong> of the magnetic field. With suitable measurements, information about the <strong>direction<\/strong> of the magnetic field can also be obtained. ⑯\n  <\/p>\n\n  <div class=\"principle\">\n    <strong>Magnetic field<\/strong>\n    &rarr;\n    NV energy-level shift\n    &rarr;\n    resonance-frequency shift\n    &rarr;\n    fluorescence change\n    &rarr;\n    <strong>measured magnetic field<\/strong>\n  <\/div>\n\n<\/div>\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/quantum_magnetometer_png.png\" target=\"_blank\">\n    <img src=\"images/quantum_magnetometer_png.png\" alt=\"High-level view of the system\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">A high-sensitivity quantum optical magnetometer (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_lybmk1ny",
      "type": "content",
      "title": "Optical Spectra",
      "text": "<div style=\"max-width:900px;margin:0 auto 22px auto;padding:22px 28px;background:linear-gradient(135deg,#172033,#243247);color:#e2e8f0;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.22);font-family:Arial,sans-serif;line-height:1.65;\">\n\n  <details>\n    <summary style=\"cursor:pointer;font-size:1.25em;font-weight:bold;color:#7dd3fc;padding:6px 0;\">\n      First, what is the Electromagnetic spectrum?\n    <\/summary>\n\nThe electromagnetic spectrum maps radiation from low-frequency radio waves (longest wavelengths, non-ionizing) to high-frequency gamma rays (shortest wavelengths, ionizing). While non-ionizing radiation lacks the photon energy to alter atomic structures, high-energy ionizing radiation (X-rays, gamma rays) strips electrons to drive chemical reactions. Spectroscopy measures this radiation across frequencies to characterize material properties and light-matter interactions.\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/The_electromagnetic_spectrum.png\" target=\"_blank\">\n    <img src=\"images/The_electromagnetic_spectrum.png\" alt=\"The electromagnetic spectrum: A comprehensive visualization illustrating the relationship between wavelength, frequency, and radiation energy—ranging from low-energy non-ionizing waves (radio, microwaves, infrared) to high-energy ionizing radiation (X-rays, gamma rays), with the narrow visible light band expanded. Image credit: National Cancer Institute / National Institutes of Health.\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">The electromagnetic spectrum: A comprehensive visualization illustrating the relationship between wavelength, frequency, and radiation energy—ranging from low-energy non-ionizing waves (radio, microwaves, infrared) to high-energy ionizing radiation (X-rays, gamma rays), with the narrow visible light band expanded. Image credit: National Cancer Institute / National Institutes of Health. (click to enlarge)<\/div>\n<\/div>\n\n\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/EM_Spectrum_Properties_edit.png\" target=\"_blank\">\n    <img src=\"images/EM_Spectrum_Properties_edit.png\" alt=\"Image Credit: Diagram of the Electromagnetic Spectrum by Inductiveload (Wikimedia Commons) / CC BY-SA 3.0 / Derived from original NASA graphics. By Inductiveload, NASA - self-made\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Image Credit: Diagram of the Electromagnetic Spectrum by Inductiveload (Wikimedia Commons) / CC BY-SA 3.0 / Derived from original NASA graphics. By Inductiveload, NASA - self-made (click to enlarge)<\/div>\n<\/div>\n\n\n\n\n<div style=\"margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.15);\">\n\n  \n   \n\n\n\n  <\/details>\n\n<\/div>\n\n<div style=\"max-width:900px;margin:0 auto 22px auto;padding:22px 28px;background:linear-gradient(135deg,#172033,#243247);color:#e2e8f0;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.22);font-family:Arial,sans-serif;line-height:1.65;\">\n\n  <details>\n    <summary style=\"cursor:pointer;font-size:1.25em;font-weight:bold;color:#7dd3fc;padding:6px 0;\">\n      What is Alternate Light Source (ALS) forensic lighting?\n    <\/summary>\n\n\n<div style=\"margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.15);\">\n\n  <p>\n    <strong>Alternate Light Source (ALS) forensic lighting systems<\/strong> use specialized wavelengths of light to reveal and document evidence that may be difficult or impossible to see under normal illumination. Some substances or specially applied forensic reagents fluoresce when illuminated at particular wavelengths, emitting visible light that makes otherwise faint evidence stand out against its surroundings. This fluorescence can be used to detect traces of body fluids, blood, fingerprints, hair, fibers, and other materials that may provide valuable forensic evidence.\n  <\/p>\n\n  <div style=\"text-align:center;margin:20px 0;\">\n    <a href=\"images/forensic_fuorescence_fingerprints.jpg\" target=\"_blank\">\n      <img\n        src=\"images/forensic_fuorescence_fingerprints.jpg\"\n        alt=\"Photo: U.S. Air Force photo by Airman 1st Class Micaiah Anthony / Public Domain (ACC.af.mil)\"\n        style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\"\n      >\n    <\/a>\n    <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">\n      Photo: U.S. Air Force photo by Airman 1st Class Micaiah Anthony / Public Domain (ACC.af.mil) (click to enlarge)\n    <\/div>\n  <\/div>\n\n<\/div>\n\n\n  <\/details>\n\n<\/div>\n\n<div style=\"max-width:900px;margin:0 auto;padding:28px 32px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.28);font-family:Arial,sans-serif;line-height:1.7;position:relative;\">\n\n  <h1>Fundamentals of Spectroscopy &amp; Analytical Instrumentation<\/h1>\n\n  <div style=\"text-align:center;margin:20px 0;\">\n    <a href=\"images/spectroscopy1.png\" target=\"_blank\">\n      <img\n        src=\"images/spectroscopy1.png\"\n        alt=\"Image source: ETERN, “US Navy Tested Tesla Laser Weapon System,” YouTube. Used for educational purposes.\"\n        style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\"\n      >\n    <\/a>\n    <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">\n      Image source: ETERN, “US Navy Tested Tesla Laser Weapon System,” YouTube. Used for educational purposes. (click to enlarge)\n    <\/div>\n  <\/div>\n\n  <h2>1. Principles of Emission and Spectral Classification<\/h2>\n\n  <p>\n    <span class=\"section-num\">①<\/span>Generally speaking, every body is a source of thermal electromagnetic radiation. With the help of a spectrograph—an instrument whose main part is a prism or a diffraction grating—light is dispersed into a spectrum.\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">②<\/span>The spectrum may turn out to be continuous, band, or line:\n  <\/p>\n\n  <div class=\"tech-grid\">\n\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Continuous Spectrum<\/b><\/div>\n  <div>\n    A smooth, unbroken range of wavelengths emitted by dense hot bodies (e.g., glowing solids, liquids, or dense gases like an incandescent bulb filament). The spectra of incandescent solids strongly resemble one another.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Line Spectrum<\/b><\/div>\n  <div>\n    Discrete, sharp lines corresponding to specific wavelengths emitted or absorbed by isolated atoms or ions.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Band Spectrum<\/b><\/div>\n  <div>\n    Closely spaced groups of lines characteristic of bound molecules due to combined electronic, vibrational, and rotational energy transitions.\n  <\/div>\n<\/div>\n\n\n  <\/div>\n\n  <p>\n    <span class=\"section-num\">③<\/span>Only a small number of substances can be heated to incandescence, making incandescent liquids a rarity in experimental optics.\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">④<\/span>The emission spectra of gases are exceptionally informative, providing the primary diagnostic means for analyzing the light reaching Earth from distant stars.\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">⑤<\/span>The most crucial insights regarding the structural composition of the Universe originate from light emitted by stellar matter in a gaseous state. Under laboratory conditions, atomic emission spectra can be readily generated.\n  <\/p>\n\n  <h2>2. Mechanisms of Atomic and Molecular Excitation<\/h2>\n\n  <p>\n    <span class=\"section-num\">⑥<\/span>To make an atom or molecule emit radiation, external energy must be supplied to transition ground-state electrons into higher energy levels. Upon relaxation to lower states, energy is released in the form of photons. The three primary excitation channels are:\n  <\/p>\n\n  <div class=\"tech-grid\">\n\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Electrical Excitation (Collisional)<\/b><\/div>\n  <div>\n    Passing an electric current through a gas causes accelerated electrons to collide with atoms, transferring kinetic energy to induce electronic transitions (e.g., gas discharge tubes, neon displays).\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Thermal Excitation (Heat)<\/b><\/div>\n  <div>\n    Elevating thermal energy increases atomic kinetic velocities, leading to inelastic collisions that populate higher energy orbitals (e.g., atomic flame emission).\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Optical Excitation / Photoexcitation (Light)<\/b><\/div>\n  <div>\n    Atoms or molecules absorb incident photons matching specific transition energies, promoting electrons to excited states. Subsequent radiative relaxation produces photoluminescence (fluorescence or phosphorescence).\n  <\/div>\n<\/div>\n\n\n  <\/div>\n\n  <p>\n    <span class=\"section-num\">⑦<\/span><strong>Forensic Application (ALS):<\/strong> Optical excitation underpins Alternate Light Source (ALS) illumination. When monochromatic radiation (e.g., 450 nm blue light) illuminates a target treated with fluorescent dye, the dye molecules undergo photoexcitation and emit longer-wavelength fluorescence (e.g., yellow/orange), isolating latent evidence through barrier filters.\n  <\/p>\n\n  <h2>3. Molecular Energy Levels and Band Structure<\/h2>\n\n  <p>\n    <span class=\"section-num\">⑧<\/span>Spectra consisting of isolated, sharply defined discrete lines are obtained exclusively from atomic gases or highly dilute solutions.\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">⑨<\/span>Solvent environments exert a solvatochromic influence on molecular spectra. By systematically comparing spectra across diverse solvents, environmental shifts can be decoupled to isolate the intrinsic spectral signature of the target molecule.\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">⑩<\/span>Obtaining a characteristic spectral signature provides an empirical framework for qualitative identification, allowing unknown compounds to be matched against reference spectral libraries without explicitly calculating complete quantum energy states.\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">⑪<\/span>Unlike purely atomic spectra governed strictly by electronic transitions, molecular states require accounting for rotational and vibrational degrees of freedom.\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">⑫<\/span>Molecular rotation and interatomic vibrations are quantized, taking on discrete eigenvalues across three coexisting regimes: electronic states, vibrational levels (<span class=\"symbol\"><i>v<\/i><\/span>), and rotational levels (<span class=\"symbol\"><i>J<\/i><\/span>).\n  <\/p>\n\n  <p>\n    <span class=\"section-num\">⑬<\/span>Resonant photon absorption requires the incoming quantum of energy (<span class=\"symbol\"><i>hν<\/i><\/span>) to match the transition gap between states:\n  <\/p>\n\n  <div class=\"tech-grid\">\n\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Purely Rotational Transitions<\/b><\/div>\n  <div>\n    Induced by low-energy quanta in the microwave and far-infrared regions (0.1–1 mm wavelengths), yielding pure rotational spectra.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Vibrational-Rotational Transitions<\/b><\/div>\n  <div>\n    Higher energy infrared radiation (3–50 &mu;m) excites vibrational states (<span class=\"symbol\">&Delta;v<\/span>). Because vibrational changes simultaneously induce rotational state changes (<span class=\"symbol\">&Delta;J<\/span>), closely spaced lines form vibrational-rotational bands.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Electronic-Vibrational-Rotational Transitions<\/b><\/div>\n  <div>\n    Visible and ultraviolet radiation possesses sufficient energy to induce electronic excitation. Coupled simultaneous changes in electronic, vibrational, and rotational states produce dense band structures that appear quasi-continuous under low spectral resolution.\n  <\/div>\n<\/div>\n\n\n  <\/div>\n\n  <h2>4. Advanced High-Resolution &amp; Near-Field Modalities<\/h2>\n\n  <div class=\"tech-grid\">\n\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Cathodoluminescence (CL)<\/b><\/div>\n  <div>\n    Focuses an electron beam inside a Scanning Electron Microscope (SEM) to induce radiative transitions, mapping electronic band structures, localized defects, and luminescence at spatial resolutions below 100 nm.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Raman Spectroscopy<\/b><\/div>\n  <div>\n    Measures inelastic photon scattering to detect vibrational and rotational energy shifts (<span class=\"symbol\">cm<sup>−1<\/sup><\/span>), identifying molecular symmetry, chemical phase transitions, and crystallographic lattice strain.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>AFM-Raman / Tip-Enhanced Raman Spectroscopy (TERS)<\/b><\/div>\n  <div>\n    Integrates Atomic Force Microscopy with Raman optics. Utilizes a plasmonic metal tip to localize near-field excitation, producing colocalized physical topography and chemical spectra at nanoscale spatial resolution.\n  <\/div>\n<\/div>\n\n\n  <\/div>\n\n  <h2>5. Photonic &amp; Elemental Analytics<\/h2>\n\n  <div class=\"tech-grid\">\n\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Fluorescence &amp; Photoluminescence Spectroscopy (FS/PL)<\/b><\/div>\n  <div>\n    Measures photo-emitted radiation following optical excitation. FS quantifies molecular emission spectra, while PL extracts semiconductor bandgap dimensions, radiative/non-radiative recombination rates, and charge carrier lifetimes.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Spectroscopic Ellipsometry (SE)<\/b><\/div>\n  <div>\n    Measures changes in the polarization state (&Psi;, &Delta;) of reflected light at non-normal incidence to calculate complex refractive index spectra (<span class=\"symbol\"><i>n<\/i>, <i>k<\/i><\/span>) and film thickness across single and multi-layer thin-film structures.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>X-ray Fluorescence (XRF)<\/b><\/div>\n  <div>\n    Measures characteristic secondary X-rays emitted during electronic inner-shell relaxation following primary X-ray excitation, quantifying elemental composition from Atomic Number 4 (Beryllium) to 92 (Uranium) down to sub-ppm levels.\n  <\/div>\n<\/div>\n\n\n  <\/div>\n\n  <h2>6. Instrumentation Architecture<\/h2>\n\n  <div class=\"tech-grid\">\n\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Monochromators &amp; Spectrographs<\/b><\/div>\n  <div>\n    Utilizes precision optical paths and scanning drive mechanisms to isolate single wavelengths (monochromators) or project dispersed spectra onto focal-plane detector arrays (spectrographs). Resolving power depends on focal length and grating groove density.\n  <\/div>\n<\/div>\n\n<div class=\"tech-card\">\n  <div class=\"tech-title\"><b>Detectors &amp; Diffraction Gratings<\/b><\/div>\n  <div>\n    Employs blazed or holographic diffraction gratings for spectral dispersion. Detection systems utilize thermoelectric or cryogenic cooling on CCD, PMT, and InGaAs sensors to maximize quantum efficiency and minimize dark current noise across the UV-Vis-NIR spectrum.\n  <\/div>\n<\/div>\n\n\n  <\/div>\n\n<\/div>\n",

      "title": "Cybersecurity of Power Supplies",
      "text": "  <h2>\n    Cybersecurity in the Electric Power Supply Sector\n  <\/h2>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Cybersecurity is a fundamental requirement for modern electricity generation and supply systems. Power infrastructure is considered critical, and it is increasingly targeted by sophisticated cyberattacks, including those from nation-states and organized groups. :contentReference[oaicite:0]{index=0} ①\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    The electric grid is a highly interconnected system that includes generation, transmission, and distribution networks operating in synchronization. This interconnection improves reliability but also means that a security breach in one part of the system can impact the entire grid. :contentReference[oaicite:1]{index=1} ②\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Power suppliers operate under strict cybersecurity and physical security regulations. A key framework is the NERC Critical Infrastructure Protection (CIP) program, which defines mandatory security requirements for protecting the bulk electric system. :contentReference[oaicite:2]{index=2} ③\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    These standards cover areas such as asset identification, access control, monitoring, incident response, and recovery planning. They ensure that companies systematically manage risks and maintain resilience against cyber threats. :contentReference[oaicite:3]{index=3} ④\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Cybersecurity in the energy sector is not handled by individual companies alone but relies heavily on collaboration. Public-private partnerships enable continuous communication between industry and government agencies responsible for national security. :contentReference[oaicite:4]{index=4} ⑤\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Organizations such as the Electricity Subsector Coordinating Council (ESCC), CISA, and the FBI InfraGard program facilitate information exchange, threat intelligence sharing, and coordinated response efforts. :contentReference[oaicite:5]{index=5} ⑥\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Information sharing is a critical defense mechanism in the sector. Platforms like the Electricity Information Sharing and Analysis Center (E-ISAC) collect, analyze, and distribute threat data to help organizations prepare for and respond to incidents. :contentReference[oaicite:6]{index=6} ⑦\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Regular training and simulation exercises, such as GridEx, allow organizations to test their response to cyberattacks and improve coordination. These exercises simulate large-scale incidents and help identify weaknesses in current security strategies. :contentReference[oaicite:7]{index=7} ⑧\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    In addition to internal measures, companies rely on third-party assessments to evaluate vulnerabilities and improve their security posture. Continuous evaluation is necessary because cyber threats evolve rapidly over time. :contentReference[oaicite:8]{index=8} ⑨\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    A major challenge is balancing cybersecurity with cost and operational efficiency. Power suppliers must ensure high reliability while managing the financial burden of implementing advanced security measures. :contentReference[oaicite:9]{index=9} ⑩\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Another challenge is the timely sharing of threat information. Delays in communication about cyber incidents can reduce the ability of organizations to respond effectively and protect their systems. :contentReference[oaicite:10]{index=10} ⑪\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 40px;\">\n    Overall, cybersecurity in the power sector requires a comprehensive and collaborative approach. It combines regulation, technology, training, and information sharing to ensure the resilience and stability of the electric grid. :contentReference[oaicite:11]{index=11} ⑫\n  <\/p>\n\n  <!-- Reference -->\n  <div style=\"font-size: 0.75em; color: #94a3b8;\">\n    Source: Electric Power Supply Association (EPSA), “Cybersecurity in the Electric Power Supply Sector.”\n  <\/div>\n\n<\/div>",

      "type": "content",
      "title": "Slide 4",
      "text": "<div style=\"max-width: 900px; margin: 0 auto; padding: 28px 32px; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.28); font-family: Arial, sans-serif; line-height: 1.7; position: relative;\">\n\n  <h2 style=\"margin-top: 0; margin-bottom: 18px; font-size: 2em; color: #f8fafc;\">\n    Intrusion Detection Systems (IDS)\n  <\/h2>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    An intrusion detection system (IDS) is a cybersecurity tool that monitors network traffic and system activity. Its purpose is to detect malicious actions, suspicious behavior, or violations of security policies. :contentReference[oaicite:1]{index=1} ①\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    Instead of blocking attacks directly, an IDS primarily generates alerts for security teams. These alerts help identify threats early and support faster incident response. :contentReference[oaicite:2]{index=2} ②\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    IDS systems can be implemented as software, hardware devices, or cloud-based services. They continuously analyze network traffic or system behavior in real time. :contentReference[oaicite:3]{index=3} ③\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    There are two main detection approaches used by IDS systems. Signature-based detection identifies known attack patterns, while anomaly-based detection identifies unusual behavior that deviates from normal system activity. :contentReference[oaicite:4]{index=4} ④\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    IDS systems are commonly classified into two main types based on their deployment. Network-based IDS (NIDS) monitor traffic across the entire network, while host-based IDS (HIDS) monitor activity on individual devices. :contentReference[oaicite:5]{index=5} ⑤\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    NIDS are typically placed at strategic points in the network, such as behind firewalls, to analyze incoming and outgoing traffic. HIDS focus on detecting changes within a specific system, such as file modifications or unusual processes. :contentReference[oaicite:6]{index=6} ⑥\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    IDS systems are often integrated with other security tools. For example, they can send alerts to centralized systems such as SIEM platforms for deeper analysis and coordinated response. :contentReference[oaicite:7]{index=7} ⑦\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 14px;\">\n    IDS alone cannot stop attacks, but they play a crucial role in detecting threats that bypass other defenses. For active protection, IDS is often combined with intrusion prevention systems (IPS), which can automatically block malicious activity. :contentReference[oaicite:8]{index=8} ⑧\n  <\/p>\n\n  <p style=\"font-size: 1.08em; margin-bottom: 40px;\">\n    Overall, IDS systems act as continuous monitoring mechanisms within a cybersecurity architecture. They provide visibility into potential threats and support proactive defense strategies. ⑨\n  <\/p>\n\n  <!-- Reference -->\n  <div style=\"position: absolute; bottom: 10px; left: 20px; right: 20px; font-size: 0.75em; color: #94a3b8;\">\n    Source: IBM, “What is an Intrusion Detection System (IDS)?”, IBM Think.\n  <\/div>\n\n<\/div>",

let state = { idx:0, quiz:{} };
const $ = (sel) => document.querySelector(sel);
function escapeHtml(str){ return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;"); }
function paragraphsFromText(text){ return String(text || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); }
function renderContent(sl){ const rawText = String(sl.text || ""); const containsHtml = /<[^>]+>/.test(rawText); let pHtml = ""; if(containsHtml){ pHtml = rawText; } else { paragraphsFromText(rawText).forEach((p,i)=>{ const cls = i===0 ? (sl.useDropcap ? "lead dropcap" : "lead") : ""; pHtml += "<p class=\""+cls+"\">" + escapeHtml(p) + "</p>"; }); } if(!pHtml){ pHtml = "<p class=\"lead dropcap\">Add slide text in the editor.</p>"; } let ul = ""; if((sl.bullets||[]).length){ ul = "<ul>"; sl.bullets.forEach(b=> ul += "<li>"+escapeHtml(b)+"</li>"); ul += "</ul>"; } return "<div class=\"h1\">"+escapeHtml(sl.title)+"</div><div class=\"book\">"+pHtml+ul+"</div>"; }
function renderQuiz(sl){ const prev = state.quiz[sl.id]; const chosen = prev && typeof prev.selectedIndex === "number" ? prev.selectedIndex : null; const answered = !!prev; let opts = ""; sl.options.forEach((txt,i)=>{ let cls = "qOpt"; if(answered){ if(i===sl.correctIndex) cls += " correct"; else if(i===chosen) cls += " wrong"; } opts += "<button class=\""+cls+"\" data-i=\""+i+"\" type=\"button\">"+escapeHtml(txt)+"</button>"; }); const fb = answered ? "<div class=\"qFeedback\">" + (prev.isCorrect ? "✅ Correct. " : "❌ Not quite. ") + escapeHtml(sl.explanation || "") + "</div>" : ""; return "<div class=\"quizBox\"><div class=\"qTitle\">"+escapeHtml(sl.title)+"</div><p class=\"qPrompt\">"+escapeHtml(sl.question||"")+"</p><div class=\"qOptions\">"+opts+"</div>"+fb+"</div>"; }
function wireQuiz(sl){ document.querySelectorAll(".qOpt").forEach(btn => { btn.onclick = () => { const i = Number(btn.getAttribute("data-i")); state.quiz[sl.id] = { selectedIndex:i, isCorrect:i === sl.correctIndex }; render(); }; }); }
function render(){ $("#courseTitle").textContent = lessonData.courseTitle; $("#courseSub").textContent = lessonData.courseSub; const goals = $("#goals"); goals.innerHTML = ""; (lessonData.learningOutcomes || []).forEach(g => { const li = document.createElement("li"); li.textContent = g; goals.appendChild(li); }); state.idx = Math.max(0, Math.min(state.idx, lessonData.slides.length - 1)); $("#slideCounter").textContent = (state.idx + 1) + " / " + lessonData.slides.length; $("#progressFill").style.width = (((state.idx + 1)/lessonData.slides.length) * 100) + "%"; const sl = lessonData.slides[state.idx]; $("#slide").innerHTML = sl.type === "quiz" ? renderQuiz(sl) : renderContent(sl); $("#statusLine").textContent = sl.type === "quiz" ? "Quick Check" : "Reading slide"; $("#btnPrev").disabled = state.idx === 0; $("#btnNext").disabled = state.idx === lessonData.slides.length - 1; if(sl.type === "quiz") wireQuiz(sl); }
$("#btnPrev").onclick = () => { state.idx = Math.max(0, state.idx - 1); render(); };
$("#btnNext").onclick = () => { state.idx = Math.min(lessonData.slides.length - 1, state.idx + 1); render(); };
document.addEventListener("keydown", (e) => { if(e.key === "ArrowLeft"){ state.idx = Math.max(0, state.idx - 1); render(); } else if(e.key === "ArrowRight"){ state.idx = Math.min(lessonData.slides.length - 1, state.idx + 1); render(); } });
render();
</script>
